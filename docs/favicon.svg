<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282a36"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="arc-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <linearGradient id="arc-p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- C: open semi-circle, offset left from the spine -->
  <path d="M29 14 A18 18 0 1 0 29 50" stroke="url(#arc-c)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Vertical spine in Dracula purple -->
  <line x1="34" y1="14" x2="34" y2="50" stroke="#bd93f9" stroke-width="3.5" stroke-linecap="round"/>
  <!-- P: semi-circle on the right, on top -->
  <path d="M34 14 A13 9 0 1 1 36 32.5" stroke="url(#arc-p)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
