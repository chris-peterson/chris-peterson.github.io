name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, scripts/refresh-blog.py]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The deployed post list comes from the files in docs/blog/, not from
      # whoever last remembered to run the recipe. A post with no date prefix or
      # no heading fails the deploy rather than shipping a half-built index.
      - name: Refresh the blog index
        run: python3 scripts/refresh-blog.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
