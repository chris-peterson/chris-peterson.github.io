<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="xt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#282a36"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="xt-bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="50%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#xt-bg)"/>
  <!-- Left angle bracket -->
  <path d="M22 16 L11 32 L22 48"
        fill="none" stroke="url(#xt-bracket)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right angle bracket -->
  <path d="M42 16 L53 32 L42 48"
        fill="none" stroke="url(#xt-bracket)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Transform arrow — XDT applying a delta -->
