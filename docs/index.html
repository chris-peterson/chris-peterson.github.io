<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>chris-peterson</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Chris Peterson's open source projects">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Docsify themeable (base styles) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.min.css">
  <!-- Prism Dracula theme for syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prism-themes@1/themes/prism-dracula.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Dracula/Alucard theme -->
  <link rel="stylesheet" href="/css/theme.css">
  <!-- Titlebar component -->
  <link rel="stylesheet" href="/css/titlebar.css">
</head>
<body>
  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <!-- Unified titlebar -->
  <div class="titlebar" id="titlebar">
    <button class="mobile-menu-toggle" id="mobileMenuToggle" onclick="toggleSidebar()" title="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>
    <a href="#/" class="titlebar-brand">
      <span>chris-peterson</span>
    </a>
    <div class="titlebar-breadcrumb">
      <span class="breadcrumb-separator">/</span>
      <div class="breadcrumb-repo-selector" id="repoSelector">
        <button class="breadcrumb-repo-toggle" onclick="toggleRepoSelector()">
          repos <i class="fas fa-chevron-down"></i>
        </button>
        <div class="breadcrumb-repo-dropdown">
          <a class="breadcrumb-repo-item" href="https://chris-peterson.github.io/pwsh-gitlab">
            <i class="fas fa-terminal"></i>
            pwsh-gitlab
            <span class="repo-description">GitLab CLI</span>
          </a>
        </div>
      </div>
    </div>
    <div class="titlebar-spacer"></div>
    <div class="titlebar-actions">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme"><i class="fas fa-moon"></i></button>
      <a href="https://github.com/chris-peterson" target="_blank" class="titlebar-github" title="View on GitHub">
        <i class="fab fa-github"></i>
      </a>
    </div>
  </div>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'chris-peterson',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: false,
      notFoundPage: true,
      relativePath: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      hideSidebar: false
    }
  </script>
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Copy code plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <!-- Theme toggle, sidebar toggle, and repo selector -->
  <script>
    // Mobile sidebar toggle functions
    function toggleSidebar() {
      document.body.classList.toggle('sidebar-open');
      document.getElementById('sidebarOverlay').classList.toggle('visible');
    }

    function closeSidebar() {
      document.body.classList.remove('sidebar-open');
      document.getElementById('sidebarOverlay').classList.remove('visible');
    }

    // Close sidebar when a link is clicked (on mobile)
    document.addEventListener('click', function(e) {
      if (e.target.closest('.sidebar-nav a')) {
        if (window.innerWidth <= 768) {
          closeSidebar();
        }
      }
    });

    // Close sidebar on window resize if going to desktop
    window.addEventListener('resize', function() {
      if (window.innerWidth > 768) {
        closeSidebar();
      }
    });

    // Theme toggle
    function toggleTheme() {
      var html = document.documentElement;
      var btn = document.getElementById('themeToggle');
      var icon = btn.querySelector('i');
      var currentScheme = html.style.colorScheme || 'dark';
      var newScheme = currentScheme === 'dark' ? 'light' : 'dark';
      html.style.colorScheme = newScheme;
      icon.className = newScheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
      localStorage.setItem('theme', newScheme);
    }

    // Load saved theme preference
    (function() {
      var saved = localStorage.getItem('theme');
      var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.style.colorScheme = theme;
      var btn = document.getElementById('themeToggle');
      if (btn) {
        var icon = btn.querySelector('i');
        if (icon) icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
      }
    })();

    // Custom copy button behavior with checkmark feedback
    (function() {
      function setupCopyButtons() {
        document.querySelectorAll('.docsify-copy-code-button').forEach(function(btn) {
          if (btn.dataset.customized) return;
          btn.dataset.customized = 'true';
          btn.addEventListener('click', function() {
            btn.classList.add('copied');
            setTimeout(function() {
              btn.classList.remove('copied');
            }, 1500);
          });
        });
      }

      if (window.$docsify) {
        window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
          hook.doneEach(function() {
            setTimeout(setupCopyButtons, 100);
          });
        });
      }
    })();

    // Repo selector dropdown
    function toggleRepoSelector() {
      document.getElementById('repoSelector').classList.toggle('open');
    }

    // Close repo selector when clicking outside
    document.addEventListener('click', function(e) {
      var selector = document.getElementById('repoSelector');
      if (!selector.contains(e.target)) {
        selector.classList.remove('open');
      }
    });
  </script>
</body>
</html>
